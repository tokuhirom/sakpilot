name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: actionlint
        uses: reviewdog/action-actionlint@83e4ed25b168066ad8f62f5afbb29ebd8641d982 # v1

  build-and-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: wails build -tags webkit2_41

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest

      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Go test
        run: go test ./...

      - name: Frontend test
        run: |
          cd frontend
          npm run test

      # E2E用エントリポイント(e2e_server.go)は通常ビルドから除外されるため個別にvetする
      - name: Vet E2E entrypoint
        run: go vet -tags e2e .

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      # wails build が生成した frontend/dist に対して、`go run -tags e2e .` の
      # E2Eサーバー(IaaS fake + sakumock)を起動してPlaywrightでテストする
      - name: E2E test
        run: |
          cd frontend
          npx playwright test
